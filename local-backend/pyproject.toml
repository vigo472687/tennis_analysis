[project]
name = "tennis-backend"
version = "0.1.0"
description = "Local tennis prototype backend: tasks, media, evidence, export and deletion over NDJSON (fixed-fixture prototype, no real pose model)"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "mediapipe==1.2.2",
    "opencv-contrib-python==5.0.0.93",
    # imported at start-up by contracts/validation.py: a runtime dependency,
    # not a development one (it was only listed under the dev group)
    "jsonschema>=4.21",
]

[project.scripts]
tennis-backend = "tennis_backend.cli:main"

[project.optional-dependencies]
real-pose = [
    "rfdetr>=0.4",
    "boxmot>=13.0",
    "rtmlib>=0.0.16",
    "onnxruntime>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_backend"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/tennis_backend/vendor"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "cv2.*", "rtmlib.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tennis_backend.vendor.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
